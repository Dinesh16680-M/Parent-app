name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parentapp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parentapp-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend-build:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parentapp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parentapp-frontend/package-lock.json
      - run: npm ci
      - name: Lint (reported, not blocking yet)
        run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          VITE_API_URL: https://parentapp-backend.onrender.com

  docker:
    name: Build & push Docker images
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image owner must be lowercase for GHCR
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: parentapp-backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/parentapp-backend:latest
            ghcr.io/${{ env.OWNER }}/parentapp-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: parentapp-frontend
          push: ${{ github.event_name == 'push' }}
          build-args: VITE_API_URL=https://parentapp-backend.onrender.com
          tags: |
            ghcr.io/${{ env.OWNER }}/parentapp-frontend:latest
            ghcr.io/${{ env.OWNER }}/parentapp-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Render
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploys and wait until the API is healthy
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://parentapp-backend.onrender.com' }}
        run: |
          if [ -z "$BACKEND_HOOK" ] || [ -z "$FRONTEND_HOOK" ]; then
            echo "::warning::Render deploy hook secrets are not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$BACKEND_HOOK" > /dev/null
          curl -fsS -X POST "$FRONTEND_HOOK" > /dev/null
          echo "Deploys triggered. Waiting for $BACKEND_URL/api/health ..."
          sleep 60
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/api/health"; then echo; echo "Backend is healthy"; exit 0; fi
            sleep 20
          done
          echo "::error::Backend did not become healthy in time"
          exit 1
