services:
  - type: web
    name: parentapp-backend
    runtime: python
    plan: free
    rootDir: parentapp-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MONGODB_URI
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: parentapp-frontend
    runtime: static
    rootDir: parentapp-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://parentapp-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html